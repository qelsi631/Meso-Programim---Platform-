  <script type="module">
    import { createCodingExercise } from "../../js/codingExercise.js";
    createCodingExercise(document.getElementById("boxModelExercise"), {
      instructions: `
        <h3>Detyrë: Stilizo një kartë me Box Model</h3>
        <p>Ke një <code>&lt;div class="card"&gt;</code> në <strong>index.html</strong>.
           Shkruaj kodin CSS në <strong>style.css</strong> që karta të ketë këto cilësi:</p>
        <ol>
          <li>Gjerësi: <strong>width: 300px</strong></li>
          <li>Padding: <strong>padding: 20px</strong></li>
          <li>Kufi: <strong>border: 2px solid #7c3aed</strong></li>
          <li>Cepa të rrumbullakët: <strong>border-radius: 12px</strong></li>
          <li>Qendërzim: <strong>margin: 20px auto</strong></li>
          <li>Box sizing: <strong>box-sizing: border-box</strong></li>
        </ol>
        <p><em>Bonus: Shto <code>background-color</code> dhe <code>color</code> për ta bërë kartën më të bukur!</em></p>
      `,
      htmlDefault: `<div class="card">
  <h2>Karta Ime</h2>
  <p>Kjo eshte nje karte e ndertuar me Box Model!</p>
</div>`,
      cssDefault: `/* Shkruaj kodin CSS ketu */

.card {

}`,
      tests: [
        {
          description: "Karta ka width: 300px",
          test: (doc) => {
            const el = doc.querySelector('.card');
            return el && getComputedStyle(el).width === '300px';
          }
        },
        {
          description: "Karta ka padding: 20px",
          test: (doc) => {
            const el = doc.querySelector('.card');
            return el && getComputedStyle(el).paddingTop === '20px';
          }
        },
        {
          description: "Karta ka border: 2px solid",
          test: (doc) => {
            const el = doc.querySelector('.card');
            if (!el) return false;
            const style = getComputedStyle(el);
            return style.borderTopStyle === 'solid' && style.borderTopWidth === '2px';
          }
        },
        {
          description: "Karta ka border-radius: 12px",
          test: (doc) => {
            const el = doc.querySelector('.card');
            return el && getComputedStyle(el).borderRadius === '12px';
          }
        },
        {
          description: "Karta ka margin: 20px auto (qendërzim)",
          test: (doc) => {
            const el = doc.querySelector('.card');
            if (!el) return false;
            const mt = getComputedStyle(el).marginTop;
            const ml = getComputedStyle(el).marginLeft;
            const mr = getComputedStyle(el).marginRight;
            return mt === '20px' && ml === mr;
          }
        },
        {
          description: "Karta ka box-sizing: border-box",
          test: (doc) => {
            const el = doc.querySelector('.card');
            return el && getComputedStyle(el).boxSizing === 'border-box';
          }
        }
      ],
      cssSolution: `.card {
  width: 300px;
  padding: 20px;
  border: 2px solid #7c3aed;
  border-radius: 12px;
  margin: 20px auto;
  box-sizing: border-box;
  background-color: #2e2e44;
  color: #e0e0f0;
}`,
      successMessage: "Shkëlqyeshëm! E kuptove Box Model-in! 🎉",
      nextUrl: "../css-mesimet/lesson.0.22.html"
    });
  </script>
