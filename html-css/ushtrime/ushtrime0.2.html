  <script type="module">
    import { createCodingExercise } from "../../js/codingExercise.js";
    createCodingExercise(document.getElementById("textFormattingExercise"), {
      instructions: `
        <h3>Detyre: Formatimi i Tekstit</h3>
        <p>Praktiko tag-et e formatimit duke shkruar paragrafe qe permbajne:</p>
        <ol>
          <li>Nje fjale te rendesishme me <code>&lt;strong&gt;</code></li>
          <li>Nje theksim me <code>&lt;em&gt;</code></li>
          <li>Nje fjale te highlight-uar me <code>&lt;mark&gt;</code></li>
          <li><code>&lt;sub&gt;</code> per nenshkrim (p.sh. H&#8322;O)</li>
          <li><code>&lt;sup&gt;</code> per mbishkrim (p.sh. x&#178;)</li>
        </ol>
        <p><em>Sugjerim: perdor fjali te shkurtra qe e bejne te qarte formatimin.</em></p>
      `,
      htmlDefault: '<!-- Shkruaj ketu HTML-in tend -->\n\n<p>Kjo eshte <strong>e rendesishme</strong> dhe <em>e theksuar</em>.</p>\n',
      cssDefault: '',
      tests: [
        {
          description: "Ka te pakten 1 <strong>",
          test: (doc) => doc.querySelectorAll('strong').length >= 1
        },
        {
          description: "Ka te pakten 1 <em>",
          test: (doc) => doc.querySelectorAll('em').length >= 1
        },
        {
          description: "Ka te pakten 1 <mark>",
          test: (doc) => doc.querySelectorAll('mark').length >= 1
        },
        {
          description: "Ka te pakten 1 <sub>",
          test: (doc) => doc.querySelectorAll('sub').length >= 1
        },
        {
          description: "Ka te pakten 1 <sup>",
          test: (doc) => doc.querySelectorAll('sup').length >= 1
        }
      ],
      successMessage: "Shkelqyeshem! Formatimi i Tekstit u kompletua! 🎉",
      nextUrl: "../mesimet/lesson0.04.html",
      htmlSolution: `<p>Kjo eshte <strong>e rendesishme</strong> dhe <em>e theksuar</em>.</p>
<p>Kjo fjale ka <mark>ngjyre te verdhe</mark> per theksim.</p>
<p>Formula e ujit eshte H<sub>2</sub>O dhe siperfaqja eshte 5m<sup>2</sup>.</p>`
    });
  </script>
