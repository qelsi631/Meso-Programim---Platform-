<head>

  <style>
    * { box-sizing: border-box; }

      margin: 0;
      font-family: "Nunito Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #1e1e2e;

      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    nav img { width: 28px; height: 28px; }
    .dashboard-btn {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0;
      background: rgba(255, 122, 0, 0.12);
      border: 1px solid rgba(255, 122, 0, 0.35);
      box-shadow: 0 4px 14px rgba(255, 122, 0, 0.15);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .dashboard-btn::before {
      content: "🏠";

    .dashboard-btn:hover {

    .goback:hover { color: #fff; }
    .exercise-header {
      margin-bottom: 24px;
    }
    .exercise-header h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 6px;
      color: #fff;
    }
    .exercise-header p {
      font-size: 14px;
      color: #94a3b8;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- TOP NAV -->
    <nav>
      <a href="#" id="menuBtn" aria-label="Hap menunë">
        <img src="../../imgs/menu (1).png" alt="Menu">
      </a>
      <a href="../../dashboard.html" class="dashboard-btn" title="Go to Dashboard">📊</a>
      <a href="../quiz/quiz-display-position.html" class="goback">Kthehu Pas</a>
    </nav>

    <!-- SIDEBAR -->
    <div class="overlay" id="overlay"></div>
    <div class="sidebar" id="sidebar" aria-hidden="true">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <img class="ikonSidebar" src="../../imgs/icon_platformes-removebg-preview.png" alt="">
          <p>Meso Programim</p>
        </div>
        <button class="sidebar-close" id="closeBtn" type="button">✕</button>
      </div>
      <div class="sidebar-links">
        <a href="../../dashboard.html">Dashboard</a>
        <a href="../../roadmap.html?course=html-fundamentals">Roadmap</a>
        <a href="#" class="report-bug-link" data-report="bug">Report a bug</a>
      </div>

    <!-- EXERCISE HEADER -->
    <div class="exercise-header">
      <h1>💻 Ushtrime: CSS Display & Position</h1>
      <p>Praktiko display dhe position — ndërto një layout me navbar fiks dhe karta të pozicionuara!</p>
    </div>

    <!-- CODING EXERCISE -->
    <div id="displayPositionExercise"></div>

  </div>

  <script src="../../js.lessons/sidebar.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../../js/requireAuth.js"></script>

  <script type="module">
    import { createCodingExercise } from "../../js/codingExercise.js";
    createCodingExercise(document.getElementById("displayPositionExercise"), {
      instructions: `
        <h3>Detyrë: Ndërto një mini-layout me Display & Position</h3>
        <p>Ke HTML-në e gatshme me një navbar, kontejner, dhe dy karta. Shkruaj CSS-në në <strong>style.css</strong>:</p>
        <ol>
          <li>Navbar-i: <strong>position: fixed</strong>, <strong>top: 0</strong>, <strong>left: 0</strong>, <strong>width: 100%</strong></li>
          <li>Butonat e navbar-it: <strong>display: inline-block</strong></li>
          <li>Kontejneri (.kontejner): <strong>position: relative</strong></li>
          <li>Badge-i (.badge): <strong>position: absolute</strong>, <strong>top: 10px</strong>, <strong>right: 10px</strong></li>
          <li>Kartat (.karta): <strong>display: block</strong></li>
        </ol>
        <p><em>Bonus: Shto ngjyra dhe padding për ta bërë layoutin më të bukur!</em></p>
      `,
      htmlDefault: `<nav class="navbar">
  <span class="logo">Faqja</span>
  <a class="nav-link" href="#">Kryefaqja</a>
  <a class="nav-link" href="#">Rreth</a>
  <a class="nav-link" href="#">Kontakt</a>
</nav>

<div class="kontejner">
  <div class="karta">
    <span class="badge">E re!</span>
    <h2>Karta 1</h2>
    <p>Kjo eshte karta e pare.</p>
  </div>
  <div class="karta">
    <h2>Karta 2</h2>
    <p>Kjo eshte karta e dyte.</p>
  </div>
</div>`,
      cssDefault: `/* Shkruaj kodin CSS ketu */

.navbar {

}

.nav-link {

}

.kontejner {

}

.badge {

}

.karta {

}`,
      tests: [
        {
          description: "Navbar ka position: fixed",
          test: (doc) => {
            const el = doc.querySelector('.navbar');
            return el && getComputedStyle(el).position === 'fixed';
          }
        },
        {
          description: "Navbar ka top: 0 dhe left: 0",
          test: (doc) => {
            const el = doc.querySelector('.navbar');
            if (!el) return false;
            const s = getComputedStyle(el);
            return s.top === '0px' && s.left === '0px';
          }
        },
        {
          description: "Navbar ka width: 100%",
          test: (doc) => {
            const el = doc.querySelector('.navbar');
            if (!el) return false;
            const parentW = el.parentElement ? el.parentElement.offsetWidth : doc.body.offsetWidth;
            return el.offsetWidth >= parentW - 2;
          }
        },
        {
          description: "Nav-linqet kanë display: inline-block",
          test: (doc) => {
            const el = doc.querySelector('.nav-link');
            return el && getComputedStyle(el).display === 'inline-block';
          }
        },
        {
          description: "Kontejneri ka position: relative",
          test: (doc) => {
            const el = doc.querySelector('.kontejner');
            return el && getComputedStyle(el).position === 'relative';
          }
        },
        {
          description: "Badge ka position: absolute",
          test: (doc) => {
            const el = doc.querySelector('.badge');
            return el && getComputedStyle(el).position === 'absolute';
          }
        },
        {
          description: "Badge ka top: 10px dhe right: 10px",
          test: (doc) => {
            const el = doc.querySelector('.badge');
            if (!el) return false;
            const s = getComputedStyle(el);
            return s.top === '10px' && s.right === '10px';
          }
        },
        {
          description: "Kartat kanë display: block",
          test: (doc) => {
            const el = doc.querySelector('.karta');
            return el && getComputedStyle(el).display === 'block';
          }
        }
      ],
      cssSolution: `.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: #262637;
  padding: 10px 20px;
}

.nav-link {
  display: inline-block;
  color: #c4b5fd;
  text-decoration: none;
  margin-left: 12px;
}

.kontejner {
  position: relative;
  margin-top: 60px;
  padding: 20px;
}

.badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #facc15;
  color: #1e1e2e;
  padding: 2px 10px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 700;
}

.karta {
  display: block;
  background: #2e2e44;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 16px;
}`,
      successMessage: "Shkëlqyeshëm! E kuptove Display & Position! 🎉",
      nextUrl: "../css-mesimet/lesson.0.23.html"
    });
  </script>

  </script>
</body>
</html>
