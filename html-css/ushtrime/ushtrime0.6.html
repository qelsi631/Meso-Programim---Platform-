  <script type="module">
    import { createCodingExercise } from "../../js/codingExercise.js";
    createCodingExercise(document.getElementById("listsExercise"), {
      instructions: `
        <h3>Detyre: Krijo Lista</h3>
        <p>Krijo dy lloje listash duke perdorur tag-et e listave:</p>
        <ol>
          <li>Krijo nje liste me pika <code>&lt;ul&gt;</code> me te pakten 3 elemente</li>
          <li>Krijo nje liste te numeruar <code>&lt;ol&gt;</code> me te pakten 3 elemente</li>
          <li>Perdor <code>&lt;li&gt;</code> per secilin element</li>
        </ol>
        <p><em>Sugjerim: mund te shkruash lista me fruta, filma ose detyra ditore.</em></p>
      `,
      htmlDefault: '<!-- Shkruaj ketu HTML-in tend -->\n\n<h2>Lista ime</h2>\n<p>Shembull i thjeshte me lista.</p>\n',
      cssDefault: '',
      tests: [
        {
          description: "Ka te pakten 1 <ul>",
          test: (doc) => doc.querySelectorAll('ul').length >= 1
        },
        {
          description: "Ka te pakten 1 <ol>",
          test: (doc) => doc.querySelectorAll('ol').length >= 1
        },
        {
          description: "Ka te pakten 3 elemente ne <ul>",
          test: (doc) => doc.querySelectorAll('ul li').length >= 3
        },
        {
          description: "Ka te pakten 3 elemente ne <ol>",
          test: (doc) => doc.querySelectorAll('ol li').length >= 3
        }
      ],
      successMessage: "Shkelqyeshem! Listat u mesuan! 🎉",
      nextUrl: "../mesimet/lesson0.11.html",
      htmlSolution: `<h2>Lista ime</h2>
<p>Shembull i thjeshte me lista.</p>

<ul>
  <li>Molla</li>
  <li>Banana</li>
  <li>Portokalli</li>
</ul>

<ol>
  <li>Hapi i pare</li>
  <li>Hapi i dyte</li>
  <li>Hapi i trete</li>
</ol>`
    });
  </script>
