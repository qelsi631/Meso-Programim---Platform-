  <script type="module">
    import { createCodingExercise } from "../../js/codingExercise.js";
    createCodingExercise(document.getElementById("formExercise"), {
      instructions: `
        <h3>Detyre: Krijo nje Formular</h3>
        <p>Krijo nje formular te thjesht me disa input types:</p>
        <ol>
          <li>Krijo nje <code>&lt;form&gt;</code></li>
          <li>Shto nje input <code>type="text"</code> per emrin</li>
          <li>Shto nje input <code>type="password"</code> per fjalekalimin</li>
          <li>Shto dy <code>radio</code> me te njejtin <code>name</code> (p.sh. F/M)</li>
          <li>Shto nje <code>checkbox</code> per "Pranoj kushtet"</li>
          <li>Shto nje buton <code>submit</code></li>
        </ol>
        <p><em>Sugjerim: perdor edhe &lt;label&gt; qe te jete me i qarte.</em></p>
      `,
      htmlDefault: '<!-- Shkruaj ketu HTML-in tend -->\n\n<form>\n  <label>Emri</label>\n  <input type="text" name="emri">\n</form>\n',
      cssDefault: '',
      tests: [
        {
          description: "Ka <form>",
          test: (doc) => !!doc.querySelector('form')
        },
        {
          description: "Ka input type=\"text\"",
          test: (doc) => !!doc.querySelector('input[type="text"]')
        },
        {
          description: "Ka input type=\"password\"",
          test: (doc) => !!doc.querySelector('input[type="password"]')
        },
        {
          description: "Ka 2 radio me te njejtin name",
          test: (doc) => {
            const radios = Array.from(doc.querySelectorAll('input[type="radio"]'));
            if (radios.length < 2) return false;
            const names = radios.map(el => el.getAttribute('name')).filter(Boolean);
            return names.some(n => names.filter(x => x === n).length >= 2);
          }
        },
        {
          description: "Ka checkbox",
          test: (doc) => !!doc.querySelector('input[type="checkbox"]')
        },
        {
          description: "Ka submit",
          test: (doc) => !!doc.querySelector('input[type="submit"], button[type="submit"]')
        }
      ],
      successMessage: "Shkelqyeshem! Formularet u mesuan! 🎉",
      nextUrl: "../mesimet/lesson0.14.html",
      htmlSolution: `<form>
  <label>Emri</label>
  <input type="text" name="emri">

  <label>Fjalekalimi</label>
  <input type="password" name="fjalekalimi">

  <p>Gjinia:</p>
  <input type="radio" name="gjinia" value="mashkull"> Mashkull
  <input type="radio" name="gjinia" value="femer"> Femer

  <br><br>
  <input type="checkbox" name="kushtet"> Pranoj kushtet

  <br><br>
  <button type="submit">Dergo</button>
</form>`
    });
  </script>
