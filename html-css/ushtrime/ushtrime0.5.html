  <script type="module">
    import { createCodingExercise } from "../../js/codingExercise.js";
    createCodingExercise(document.getElementById("imagesExercise"), {
      instructions: `
        <h3>Detyre: Shto nje Imazh Profili</h3>
        <p>Krijo nje profil te thjesht social duke shfaqur foton e profilit me <code>&lt;img&gt;</code>:</p>
        <ol>
          <li>Shto nje imazh me <code>&lt;img&gt;</code></li>
          <li>Vendos <code>src</code> te vlefshme (p.sh. <strong>https://i.imgur.com/8Km9tLL.jpg</strong>)</li>
          <li>Shkruaj nje <code>alt</code> pershkrues</li>
          <li>Cakto nje madhesi me <code>width</code> (p.sh. 160)</li>
        </ol>
        <p><em>Sugjerim: kopjo linkun e imazhit dhe vendose te src.</em></p>
      `,
      htmlDefault: '<!-- Shkruaj ketu HTML-in tend -->\n\n<h2>Profili im</h2>\n<p>Fotoja ime e profilit:</p>\n',
      cssDefault: '',
      tests: [
        {
          description: "Ka te pakten 1 <img>",
          test: (doc) => doc.querySelectorAll('img').length >= 1
        },
        {
          description: "Ka src te vlefshme",
          test: (doc) => {
            const img = doc.querySelector('img');
            return img && (img.getAttribute('src') || '').trim().length > 0;
          }
        },
        {
          description: "Ka alt pershkrues",
          test: (doc) => {
            const img = doc.querySelector('img');
            return img && (img.getAttribute('alt') || '').trim().length > 0;
          }
        },
        {
          description: "Ka width te vendosur",
          test: (doc) => {
            const img = doc.querySelector('img');
            if (!img) return false;
            const w = (img.getAttribute('width') || '').trim();
            const style = (img.getAttribute('style') || '').toLowerCase();
            return w !== '' || /width\s*:\s*\d/.test(style);
          }
        }
      ],
      successMessage: "Shkelqyeshem! Imazhet u mesuan! 🎉",
      nextUrl: "../mesimet/lesson0.09.html",
      htmlSolution: `<h2>Profili im</h2>
<p>Fotoja ime e profilit:</p>
<img src="https://via.placeholder.com/200" alt="Foto e profilit" width="200">`
    });
  </script>
