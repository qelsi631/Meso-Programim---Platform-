  <script type="module">
    import { createCodingExercise } from "../../js/codingExercise.js";
    createCodingExercise(document.getElementById("headingsExercise"), {
      instructions: `
        <h3>Detyre: Titujt &amp; Paragrafet</h3>
        <p>Shkruaj HTML per te krijuar nje strukture artikulli me tituj dhe paragrafe:</p>
        <ol>
          <li>Krijo nje titull kryesor me <code>&lt;h1&gt;</code></li>
          <li>Krijo dy nen-tituj me <code>&lt;h2&gt;</code></li>
          <li>Nen secilin nen-titull shkruaj nga nje paragraf me <code>&lt;p&gt;</code></li>
        </ol>
        <p><em>Sugjerim: mendo sikur po shkruan nje artikull me kapituj.</em></p>
      `,
      htmlDefault: '<!-- Shkruaj ketu HTML-in tend -->\n\n<h1>Kodi im i pare</h1>\n',
      cssDefault: '',
      tests: [
        {
          description: "Ka 1 titull <h1>",
          test: (doc) => doc.querySelectorAll('h1').length >= 1
        },
        {
          description: "Ka te pakten 2 <h2>",
          test: (doc) => doc.querySelectorAll('h2').length >= 2
        },
        {
          description: "Ka te pakten 2 <p>",
          test: (doc) => doc.querySelectorAll('p').length >= 2
        }
      ],
      successMessage: "Shkelqyeshem! Titujt & Paragrafet u plotesuan! \ud83c\udf89"
    });
  </script>

  <script type="module">

    const COURSE_SLUG = "html-fundamentals";
    const LESSON_ID = "l4";

    document.addEventListener("ce-all-passed", async () => {
      await markLessonCompleted(COURSE_SLUG, LESSON_ID);
    });
