<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ushtrime CSS: Flexbox | Mëso Programim</title>

  <link rel="stylesheet" href="../../css/codingExercise.css">
  <link rel="stylesheet" href="../../sidebar.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Nunito Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #1e1e2e;
      color: #e0e0f0;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    nav img { width: 28px; height: 28px; }
    .dashboard-btn {
      font-size: 20px;
      text-decoration: none;
    }
    .goback {
      margin-left: auto;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color .2s;
    }
    .goback:hover { color: #fff; }
    .exercise-header {
      margin-bottom: 24px;
    }
    .exercise-header h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 6px;
      color: #fff;
    }
    .exercise-header p {
      font-size: 14px;
      color: #94a3b8;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- TOP NAV -->
    <nav>
      <a href="#" id="menuBtn" aria-label="Hap menunë">
        <img src="../../imgs/menu (1).png" alt="Menu">
      </a>
      <a href="../../dashboard.html" class="dashboard-btn" title="Go to Dashboard">📊</a>
      <a href="../quiz/quiz-flexbox.html" class="goback">Kthehu Pas</a>
    </nav>

    <!-- SIDEBAR -->
    <div class="overlay" id="overlay"></div>
    <div class="sidebar" id="sidebar" aria-hidden="true">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <img class="ikonSidebar" src="../../imgs/icon_platformes-removebg-preview.png" alt="">
          <p>Meso Programim</p>
        </div>
        <button class="sidebar-close" id="closeBtn" type="button">✕</button>
      </div>
      <div class="sidebar-links">
        <a href="../../dashboard.html">Dashboard</a>
        <a href="../../roadmap.html?course=html-fundamentals">Roadmap</a>
        <a href="#" class="report-bug-link" data-report="bug">Report a bug</a>
      </div>
    </div>

    <!-- EXERCISE HEADER -->
    <div class="exercise-header">
      <h1>💻 Ushtrime: CSS Flexbox</h1>
      <p>Praktiko Flexbox — ndërto një navbar dhe layout me karta duke përdorur flex!</p>
    </div>

    <!-- CODING EXERCISE -->
    <div id="flexboxExercise"></div>

  </div>

  <script src="../../js.lessons/sidebar.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../../js/requireAuth.js"></script>

  <script type="module">
    import { createCodingExercise } from "../../js/codingExercise.js";
    createCodingExercise(document.getElementById("flexboxExercise"), {
      instructions: `
        <h3>Detyrë: Ndërto layout me Flexbox</h3>
        <p>Ke HTML-në e gatshme me një navbar dhe tre karta. Shkruaj CSS-në në <strong>style.css</strong>:</p>
        <ol>
          <li>Navbar (.navbar): <strong>display: flex</strong></li>
          <li>Navbar: <strong>justify-content: space-between</strong></li>
          <li>Navbar: <strong>align-items: center</strong></li>
          <li>Nav-linqet (.nav-linqet): <strong>display: flex</strong>, <strong>gap: 20px</strong></li>
          <li>Kartat (.kartat): <strong>display: flex</strong>, <strong>flex-wrap: wrap</strong>, <strong>gap: 16px</strong></li>
          <li>Secila kartë (.karta): <strong>flex: 1 1 200px</strong></li>
        </ol>
        <p><em>Bonus: Shto ngjyra, padding dhe border-radius për ta bërë layoutin më të bukur!</em></p>
      `,
      htmlDefault: `<nav class="navbar">
  <span class="logo">MesoCode</span>
  <div class="nav-linqet">
    <a href="#">Kryefaqja</a>
    <a href="#">Kurset</a>
    <a href="#">Kontakt</a>
  </div>
</nav>

<div class="kartat">
  <div class="karta">
    <h2>HTML</h2>
    <p>Meso strukturen e faqeve.</p>
  </div>
  <div class="karta">
    <h2>CSS</h2>
    <p>Meso stilizimin e faqeve.</p>
  </div>
  <div class="karta">
    <h2>JavaScript</h2>
    <p>Meso programimin e faqeve.</p>
  </div>
</div>`,
      cssDefault: `/* Shkruaj kodin CSS ketu */

.navbar {

}

.nav-linqet {

}

.kartat {

}

.karta {

}`,
      tests: [
        {
          description: "Navbar ka display: flex",
          test: (doc) => {
            const el = doc.querySelector('.navbar');
            return el && getComputedStyle(el).display === 'flex';
          }
        },
        {
          description: "Navbar ka justify-content: space-between",
          test: (doc) => {
            const el = doc.querySelector('.navbar');
            return el && getComputedStyle(el).justifyContent === 'space-between';
          }
        },
        {
          description: "Navbar ka align-items: center",
          test: (doc) => {
            const el = doc.querySelector('.navbar');
            return el && getComputedStyle(el).alignItems === 'center';
          }
        },
        {
          description: "Nav-linqet kanë display: flex",
          test: (doc) => {
            const el = doc.querySelector('.nav-linqet');
            return el && getComputedStyle(el).display === 'flex';
          }
        },
        {
          description: "Nav-linqet kanë gap: 20px",
          test: (doc) => {
            const el = doc.querySelector('.nav-linqet');
            return el && getComputedStyle(el).gap === '20px';
          }
        },
        {
          description: "Kartat kanë display: flex",
          test: (doc) => {
            const el = doc.querySelector('.kartat');
            return el && getComputedStyle(el).display === 'flex';
          }
        },
        {
          description: "Kartat kanë flex-wrap: wrap",
          test: (doc) => {
            const el = doc.querySelector('.kartat');
            return el && getComputedStyle(el).flexWrap === 'wrap';
          }
        },
        {
          description: "Kartat kanë gap: 16px",
          test: (doc) => {
            const el = doc.querySelector('.kartat');
            return el && getComputedStyle(el).gap === '16px';
          }
        },
        {
          description: "Karta ka flex: 1 1 200px",
          test: (doc) => {
            const el = doc.querySelector('.karta');
            if (!el) return false;
            const s = getComputedStyle(el);
            return s.flexGrow === '1' && s.flexShrink === '1' && s.flexBasis === '200px';
          }
        }
      ],
      cssSolution: `.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: #262637;
  border-radius: 10px;
  margin-bottom: 20px;
}

.logo {
  color: #7c3aed;
  font-weight: 800;
  font-size: 18px;
}

.nav-linqet {
  display: flex;
  gap: 20px;
}

.nav-linqet a {
  color: #c4b5fd;
  text-decoration: none;
}

.kartat {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.karta {
  flex: 1 1 200px;
  background: #2e2e44;
  padding: 20px;
  border-radius: 10px;
  border: 1px solid rgba(124, 106, 244, 0.2);
}

.karta h2 {
  color: #fff;
  margin: 0 0 8px;
}

.karta p {
  color: #94a3b8;
  margin: 0;
}`,
      successMessage: "Shkëlqyeshëm! E kuptove Flexbox-in! 🎉"
    });
  </script>

  <script type="module">
    import { markLessonCompleted } from "../../js/courseProgressManager.js";
    const COURSE_SLUG = "html-fundamentals";
    const LESSON_ID = "e3";

    document.addEventListener("ce-all-passed", async () => {
      await markLessonCompleted(COURSE_SLUG, LESSON_ID);
    });
  </script>
</body>
</html>
