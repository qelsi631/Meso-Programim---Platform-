        </ol>
        <p><em>Sugjerim: shkruaj titullin e eventit, adresen me &lt;br&gt;, pastaj nda me &lt;hr&gt; dhe shto agjenden.</em></p>
      `,

      cssDefault: '',
      tests: [
        {
          description: "Ka te pakten 2 <br>",
          test: (doc) => doc.querySelectorAll('br').length >= 2
        },
        {
          description: "Ka te pakten 1 <hr>",
          test: (doc) => doc.querySelectorAll('hr').length >= 1
        }
      ],
      successMessage: "Shkelqyeshem! <br> dhe <hr> u mesuan! 🎉",
