<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — HTML Bazat | Mëso Programimin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz.css" />
  <link rel="stylesheet" href="../../css/gamification.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="page">
    <nav class="topbar">
      <a class="icon-btn" href="../mesimet/welcome.html" aria-label="Kthehu pas">←</a>
      <div class="topbar-actions">
        <a href="../../dashboard.html" class="icon-btn" title="Dashboard">📊</a>
        <a href="#" class="icon-btn report-bug-link" data-report="bug" title="Report a bug">🐞</a>
      </div>
      <div class="topbar-title">
        <p class="tiny">Quiz</p>
        <h1>HTML Bazat</h1>
      </div>
      <div class="progress-wrap" aria-label="Progresi i quiz-it">
        <span class="progress-text" id="progressText">1/5</span>
        <div class="progress">
          <div class="progress-bar" id="progressBar" style="width: 20%"></div>
        </div>
      </div>
    </nav>

    <main class="container">
      <section class="card">
        <div style="display:flex; align-items:center; gap:8px;">
          <p class="badge" id="badge">Pyetja 1</p>
          <span class="q-type-label" id="qTypeLabel">plotëso kodin</span>
        </div>
        <h2 class="question" id="questionText"></h2>

        <div class="code-block" id="codeBlock" style="display:none;"></div>
        <div class="word-bank" id="wordBank" style="display:none;"></div>
        <div class="type-answer-wrap" id="typeWrap" style="display:none;">
          <input class="type-answer-input" id="typeInput" placeholder="Shkruaj vlerën..." autocomplete="off" spellcheck="false" />
        </div>
        <form class="options" id="quizForm" style="display:none;"></form>

        <div class="live-preview hidden-preview" id="livePreview"></div>
        <div class="result-banner" id="resultBanner"></div>
        <div class="explanation" id="explanation"></div>
      </section>

      <div class="right-actions">
        <button class="btn primary" type="button" id="submitBtn">Dërgo</button>
        <button class="btn ghost hidden" type="button" id="retryBtn">Provo prap</button>
        <button class="btn next" type="button" id="nextBtn" disabled>Vazhdo →</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { markLessonCompleted } from "../../js/courseProgressManager.js";
    import { quizTracker } from "../../js/quizGamification.js";
    import { createQuizLives } from "../../js/quizLives.js";

    const COURSE_SLUG = "html-fundamentals";
    const LESSON_ID = "l5";

    const quizData = [
      {
        type: "fill-blank",
        badge: "Pyetja 1",
        question: "Plotëso strukturën bazë të një dokumenti HTML:",
        code: [
          { text: '&lt;!DOCTYPE ', class: 'keyword' },
          { blank: 0 },
          { text: '&gt;', class: 'keyword' },
          { text: '\n', class: '' },
          { text: '&lt;html&gt;', class: 'tag' },
          { text: '\n  ', class: '' },
          { text: '&lt;head&gt;', class: 'tag' },
          { text: '\n    ', class: '' },
          { text: '&lt;title&gt;Faqja ime&lt;/title&gt;', class: 'tag' },
          { text: '\n  ', class: '' },
          { text: '&lt;/head&gt;', class: 'tag' },
          { text: '\n  ', class: '' },
          { text: '&lt;', class: 'tag' },
          { blank: 1 },
          { text: '&gt;', class: 'tag' },
          { text: '\n    ', class: '' },
          { text: '&lt;p&gt;Përshëndetje!&lt;/p&gt;', class: 'tag' },
          { text: '\n  ', class: '' },
          { text: '&lt;/body&gt;', class: 'tag' },
          { text: '\n', class: '' },
          { text: '&lt;/html&gt;', class: 'tag' }
        ],
        blanks: [
          { answer: "html", placeholder: "___" },
          { answer: "body", placeholder: "___" }
        ],
        chips: ["html", "head", "body", "div"],
        explanation: "Çdo dokument HTML fillon me <code>&lt;!DOCTYPE html&gt;</code>, pastaj <code>&lt;html&gt;</code>, <code>&lt;head&gt;</code> për meta-data, dhe <code>&lt;body&gt;</code> për përmbajtjen e dukshme."
      },
      {
        type: "mcq",
        badge: "Pyetja 2",
        question: "Çka është HTML?",
        answers: [
          { text: "Një gjuhë programimi si Python", correct: false },
          { text: "Një gjuhë markup për strukturën e faqeve web", correct: true },
          { text: "Një databazë për ruajtjen e të dhënave", correct: false },
          { text: "Një sistem operativ", correct: false }
        ],
        explanation: "HTML (HyperText Markup Language) nuk është gjuhë programimi — është gjuhë markup që përcakton strukturën e përmbajtjes në faqe web."
      },
      {
        type: "type-answer",
        badge: "Pyetja 3",
        question: "Cili tag përdoret për të krijuar një <strong>paragraf</strong> në HTML?",
        code: [
          { text: '&lt;', class: 'tag' },
          { blank: 0 },
          { text: '&gt;Teksti im.&lt;/', class: 'tag' },
          { text: 'p', class: 'tag' },
          { text: '&gt;', class: 'tag' }
        ],
        blanks: [
          { answer: "p", placeholder: "shkruaj tag-un..." }
        ],
        acceptAlternatives: ["p"],
        explanation: "Tag-u <code>&lt;p&gt;</code> përdoret për paragrafë. Është një nga tag-et më të përdorura në HTML."
      },
      {
        type: "fill-blank",
        badge: "Pyetja 4",
        question: "Plotëso kodin për të krijuar një titull dhe një paragraf:",
        code: [
          { text: '&lt;', class: 'tag' },
          { blank: 0 },
          { text: '&gt;Mirësevini&lt;/h1&gt;', class: 'tag' },
          { text: '\n', class: '' },
          { text: '&lt;', class: 'tag' },
          { blank: 1 },
          { text: '&gt;Kjo është faqja ime.&lt;/p&gt;', class: 'tag' }
        ],
        blanks: [
          { answer: "h1", placeholder: "___" },
          { answer: "p", placeholder: "___" }
        ],
        chips: ["h1", "p", "div", "span"],
        explanation: "<code>&lt;h1&gt;</code> është titulli kryesor i faqes, kurse <code>&lt;p&gt;</code> përdoret për paragrafë."
      },
      {
        type: "mcq",
        badge: "Pyetja 5",
        question: "Kush e krijoi HTML-në?",
        answers: [
          { text: "Bill Gates", correct: false },
          { text: "Tim Berners-Lee", correct: true },
          { text: "Steve Jobs", correct: false },
          { text: "Mark Zuckerberg", correct: false }
        ],
        explanation: "Tim Berners-Lee krijoi HTML-në në vitin 1991 bashkë me World Wide Web."
      }
    ];

    // ─── DOM REFS ───
    const badge = document.getElementById("badge");
    const qTypeLabel = document.getElementById("qTypeLabel");
    const questionText = document.getElementById("questionText");
    const codeBlock = document.getElementById("codeBlock");
    const wordBank = document.getElementById("wordBank");
    const typeWrap = document.getElementById("typeWrap");
    const typeInput = document.getElementById("typeInput");
    const quizForm = document.getElementById("quizForm");
    const livePreview = document.getElementById("livePreview");
    const resultBanner = document.getElementById("resultBanner");
    const explanation = document.getElementById("explanation");
    const submitBtn = document.getElementById("submitBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");

    let current = 0;
    const tracker = quizTracker(quizData.length);
    const lives = createQuizLives(LESSON_ID);
    let blankValues = [];
    let answered = false;

    function renderQuestion() {
      const q = quizData[current];
      answered = false;
      blankValues = q.blanks ? q.blanks.map(() => null) : [];

      badge.textContent = q.badge;
      questionText.innerHTML = q.question;
      progressText.textContent = `${current + 1}/${quizData.length}`;
      progressBar.style.width = `${((current + 1) / quizData.length) * 100}%`;

      resultBanner.className = "result-banner";
      resultBanner.textContent = "";
      explanation.className = "explanation";
      explanation.innerHTML = "";
      submitBtn.disabled = false;
      nextBtn.disabled = true;
      retryBtn.classList.add("hidden");
      livePreview.classList.add("hidden-preview");

      codeBlock.style.display = "none";
      wordBank.style.display = "none";
      typeWrap.style.display = "none";
      quizForm.style.display = "none";

      if (q.type === "fill-blank") { qTypeLabel.textContent = "plotëso kodin"; renderFillBlank(q); }
      else if (q.type === "type-answer") { qTypeLabel.textContent = "shkruaj përgjigjen"; renderTypeAnswer(q); }
      else if (q.type === "mcq") { qTypeLabel.textContent = "zgjedh përgjigjen"; renderMCQ(q); }
    }

    function renderFillBlank(q) {
      codeBlock.style.display = "block";
      wordBank.style.display = "flex";
      let html = '';
      for (const part of q.code) {
        if (part.blank !== undefined) {
          const b = q.blanks[part.blank];
          html += `<span class="blank-slot" data-blank="${part.blank}"><span class="placeholder-dots">${b.placeholder}</span></span>`;
        } else {
          const cls = part.class ? ` class="${part.class}"` : '';
          html += `<span${cls}>${part.text.replace(/\n/g, '<br>')}</span>`;
        }
      }
      codeBlock.innerHTML = html;
      const shuffled = [...q.chips].sort(() => Math.random() - 0.5);
      wordBank.innerHTML = shuffled.map(chip => `<button type="button" class="word-chip" data-value="${chip}">${chip}</button>`).join('');
      wordBank.querySelectorAll('.word-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          if (answered || btn.classList.contains('used')) return;
          const emptyIdx = blankValues.indexOf(null);
          if (emptyIdx === -1) return;
          blankValues[emptyIdx] = btn.dataset.value;
          btn.classList.add('used');
          const slot = codeBlock.querySelector(`.blank-slot[data-blank="${emptyIdx}"]`);
          slot.textContent = btn.dataset.value;
          slot.classList.add('filled');
          slot.dataset.chipValue = btn.dataset.value;
        });
      });
      codeBlock.addEventListener('click', (e) => {
        const slot = e.target.closest('.blank-slot');
        if (!slot || !slot.classList.contains('filled') || answered) return;
        const idx = parseInt(slot.dataset.blank);
        const val = blankValues[idx];
        const chip = wordBank.querySelector(`.word-chip[data-value="${val}"]`);
        if (chip) chip.classList.remove('used');
        blankValues[idx] = null;
        slot.classList.remove('filled');
        slot.innerHTML = `<span class="placeholder-dots">${q.blanks[idx].placeholder}</span>`;
        delete slot.dataset.chipValue;
      });
    }

    function renderTypeAnswer(q) {
      codeBlock.style.display = "block";
      typeWrap.style.display = "flex";
      let html = '';
      for (const part of q.code) {
        if (part.blank !== undefined) {
          html += `<span class="blank-slot" data-blank="${part.blank}" id="typeBlank"><span class="placeholder-dots">${q.blanks[part.blank].placeholder}</span></span>`;
        } else {
          const cls = part.class ? ` class="${part.class}"` : '';
          html += `<span${cls}>${part.text.replace(/\n/g, '<br>')}</span>`;
        }
      }
      codeBlock.innerHTML = html;
      typeInput.value = "";
      typeInput.className = "type-answer-input";
      typeInput.placeholder = q.blanks[0].placeholder;
      typeInput.focus();
      typeInput.addEventListener('input', () => {
        if (answered) return;
        const val = typeInput.value.trim();
        const slot = document.getElementById('typeBlank');
        if (val) { slot.textContent = val; slot.classList.add('filled'); blankValues[0] = val; }
        else { slot.innerHTML = `<span class="placeholder-dots">${q.blanks[0].placeholder}</span>`; slot.classList.remove('filled'); blankValues[0] = null; }
      });
      typeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitBtn.click(); } });
    }

    function renderMCQ(q) {
      quizForm.style.display = "flex";
      quizForm.innerHTML = q.answers.map((a, idx) => `
        <label class="option" data-idx="${idx}" ${a.correct ? 'data-correct="true"' : ''}>
          <input type="radio" name="q" value="${idx}">
          <span>${a.text}</span>
        </label>
      `).join('');
    }

    submitBtn.addEventListener("click", () => {
      if (answered) return;
      const q = quizData[current];
      if (q.type === "fill-blank") submitFillBlank(q);
      else if (q.type === "type-answer") submitTypeAnswer(q);
      else if (q.type === "mcq") submitMCQ(q);
    });

    function submitFillBlank(q) {
      if (blankValues.some(v => v === null)) { showResult("bad", "Plotëso të gjitha boshllëqet!"); return; }
      const allCorrect = q.blanks.every((b, i) => blankValues[i]?.toLowerCase() === b.answer.toLowerCase());
      answered = true;
      codeBlock.querySelectorAll('.blank-slot').forEach(slot => {
        const idx = parseInt(slot.dataset.blank);
        slot.classList.add(blankValues[idx]?.toLowerCase() === q.blanks[idx].answer.toLowerCase() ? 'correct' : 'wrong');
      });
      wordBank.querySelectorAll('.word-chip').forEach(chip => {
        const val = chip.dataset.value;
        const isAnswer = q.blanks.some(b => b.answer.toLowerCase() === val.toLowerCase());
        if (isAnswer) chip.classList.add('correct-chip');
        else if (chip.classList.contains('used')) chip.classList.add('wrong-chip');
      });
      if (allCorrect) { showResult("good", "🎉 Saktë! Bravo!"); tracker.correct(); nextBtn.disabled = false; }
      else { showResult("bad", "❌ Jo saktë. Provo përsëri!"); tracker.wrong(); lives.loseHeart(); retryBtn.classList.remove("hidden"); }
      if (q.explanation) { explanation.innerHTML = q.explanation; explanation.classList.add("show"); }
      submitBtn.disabled = true;
    }

    function submitTypeAnswer(q) {
      const userVal = typeInput.value.trim().toLowerCase();
      if (!userVal) { showResult("bad", "Shkruaj një vlerë!"); return; }
      answered = true;
      const slot = document.getElementById('typeBlank');
      const alternatives = q.acceptAlternatives || [q.blanks[0].answer];
      const isCorrect = alternatives.some(a => a.toLowerCase() === userVal);
      if (isCorrect) { slot.classList.add('correct'); typeInput.classList.add('correct'); showResult("good", "🎉 Saktë! Bravo!"); tracker.correct(); nextBtn.disabled = false; }
      else { slot.classList.add('wrong'); typeInput.classList.add('wrong'); showResult("bad", `❌ Jo saktë. Përgjigja: ${q.blanks[0].answer}`); tracker.wrong(); lives.loseHeart(); retryBtn.classList.remove("hidden"); }
      if (q.explanation) { explanation.innerHTML = q.explanation; explanation.classList.add("show"); }
      submitBtn.disabled = true;
    }

    function submitMCQ(q) {
      const selected = quizForm.querySelector('input[name="q"]:checked');
      if (!selected) { showResult("bad", "Zgjedh një përgjigje!"); return; }
      answered = true;
      const selectedIdx = parseInt(selected.value);
      const isCorrect = q.answers[selectedIdx].correct;
      quizForm.querySelectorAll('.option').forEach(opt => {
        opt.classList.add('disabled');
        if (opt.dataset.correct === "true") opt.classList.add('correct');
        if (parseInt(opt.dataset.idx) === selectedIdx && !isCorrect) opt.classList.add('wrong');
      });
      if (isCorrect) { showResult("good", "🎉 Saktë!"); tracker.correct(); nextBtn.disabled = false; }
      else { showResult("bad", "❌ Gabim!"); tracker.wrong(); lives.loseHeart(); retryBtn.classList.remove("hidden"); }
      if (q.explanation) { explanation.innerHTML = q.explanation; explanation.classList.add("show"); }
      submitBtn.disabled = true;
    }

    retryBtn.addEventListener("click", () => { renderQuestion(); });

    nextBtn.addEventListener("click", async () => {
      current++;
      if (current < quizData.length) renderQuestion();
      else await tracker.finish(COURSE_SLUG, LESSON_ID, "../../html-css/mesimet/lesson0.03.html");
    });

    function showResult(type, msg) {
      resultBanner.textContent = msg;
      resultBanner.className = `result-banner show ${type}`;
    }

    renderQuestion();
  </script>



</body>
</html>
