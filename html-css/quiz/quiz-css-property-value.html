<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — CSS Properties | Mëso Programimin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz.css" />
  <link rel="stylesheet" href="../../css/gamification.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="page">
    <nav class="topbar">
      <a class="icon-btn" href="/html-css/css-mesimet/welcome-css.html" aria-label="Kthehu pas">←</a>
      <div class="topbar-actions">
        <a href="../../dashboard.html" class="icon-btn" title="Dashboard">📊</a>
        <a href="#" class="icon-btn report-bug-link" data-report="bug" title="Report a bug">🐞</a>
      </div>
      <div class="topbar-title">
        <p class="tiny">Quiz</p>
        <h1>CSS Properties</h1>
      </div>
      <div class="progress-wrap" aria-label="Progresi i quiz-it">
        <span class="progress-text" id="progressText">1/5</span>
        <div class="progress">
          <div class="progress-bar" id="progressBar" style="width: 20%"></div>
        </div>
      </div>
    </nav>

    <main class="container">
      <section class="card">
        <div style="display:flex; align-items:center; gap:8px;">
          <p class="badge" id="badge">Pyetja 1</p>
          <span class="q-type-label" id="qTypeLabel">plotëso kodin</span>
        </div>
        <h2 class="question" id="questionText"></h2>

        <!-- Code block (for fill-blank & type-answer) -->
        <div class="code-block" id="codeBlock" style="display:none;"></div>

        <!-- Word bank (for fill-blank) -->
        <div class="word-bank" id="wordBank" style="display:none;"></div>

        <!-- Type answer input (for type-answer) -->
        <div class="type-answer-wrap" id="typeWrap" style="display:none;">
          <input class="type-answer-input" id="typeInput" placeholder="Shkruaj vlerën..." autocomplete="off" spellcheck="false" />
        </div>

        <!-- Multiple choice options (for mcq) -->
        <form class="options" id="quizForm" style="display:none;"></form>

        <!-- Live preview -->
        <div class="live-preview hidden-preview" id="livePreview"></div>

        <!-- Result -->
        <div class="result-banner" id="resultBanner"></div>
        <div class="explanation" id="explanation"></div>
      </section>

      <div class="right-actions">
        <button class="btn primary" type="button" id="submitBtn">Dërgo</button>
        <button class="btn ghost hidden" type="button" id="retryBtn">Provo prap</button>
        <button class="btn next" type="button" id="nextBtn" disabled>Vazhdo →</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { markLessonCompleted } from "../../js/courseProgressManager.js";
    import { quizTracker } from "../../js/quizGamification.js";

    const COURSE_SLUG = "html-fundamentals";
    const LESSON_ID = "q1";

    // ─── QUIZ DATA ───
    // Types: "fill-blank" | "type-answer" | "mcq"
    const quizData = [
      {
        type: "fill-blank",
        badge: "Pyetja 1",
        question: "Plotëso kodin për të bërë tekstin me ngjyrë të kuqe:",
        code: [
          { text: 'p {', class: 'punct' },
          { text: '  ', class: '' },
          { text: 'color', class: 'prop' },
          { text: ': ', class: 'punct' },
          { blank: 0 },
          { text: ';', class: 'punct' },
          { text: '}', class: 'punct' },
        ],
        blanks: [
          { answer: "red", placeholder: "___" }
        ],
        chips: ["red", "big", "bold", "left"],
        explanation: "<code>color: red;</code> ndryshon ngjyrën e tekstit në të kuqe."
      },
      {
        type: "fill-blank",
        badge: "Pyetja 2",
        question: "Plotëso kodin për të ndryshuar madhësinë e fontit në 20px:",
        code: [
          { text: 'h1 {', class: 'punct' },
          { text: '  ', class: '' },
          { blank: 0 },
          { text: ': ', class: 'punct' },
          { blank: 1 },
          { text: ';', class: 'punct' },
          { text: '}', class: 'punct' },
        ],
        blanks: [
          { answer: "font-size", placeholder: "___" },
          { answer: "20px", placeholder: "___" }
        ],
        chips: ["font-size", "text-size", "20px", "20"],
        explanation: "<code>font-size</code> kontrollon madhësinë e tekstit. Vlera mund të jetë në px, em, rem, etj."
      },
      {
        type: "type-answer",
        badge: "Pyetja 3",
        question: "Cila vlerë e <code>background-color</code> e bën sfondinin blu?",
        code: [
          { text: 'div {', class: 'punct' },
          { text: '  ', class: '' },
          { text: 'background-color', class: 'prop' },
          { text: ': ', class: 'punct' },
          { blank: 0 },
          { text: ';', class: 'punct' },
          { text: '}', class: 'punct' },
        ],
        blanks: [
          { answer: "blue", placeholder: "shkruaj ngjyrën..." }
        ],
        acceptAlternatives: ["blue", "#0000ff", "#00f", "rgb(0,0,255)", "rgb(0, 0, 255)"],
        explanation: "Vlera <code>blue</code> është njëra nga ngjyrat e emëruara (named colors) në CSS."
      },
      {
        type: "mcq",
        badge: "Pyetja 4",
        question: "Cila pronë CSS përdoret për të ndryshuar ngjyrën e sfondit?",
        answers: [
          { text: "color", correct: false },
          { text: "background-color", correct: true },
          { text: "font-color", correct: false },
          { text: "bg-color", correct: false }
        ],
        explanation: "<code>background-color</code> ndryshon ngjyrën e sfondit të elementit."
      },
      {
        type: "fill-blank",
        badge: "Pyetja 5",
        question: "Plotëso kodin për të vendosur teksin në qendër:",
        code: [
          { text: 'p {', class: 'punct' },
          { text: '  ', class: '' },
          { blank: 0 },
          { text: ': ', class: 'punct' },
          { blank: 1 },
          { text: ';', class: 'punct' },
          { text: '}', class: 'punct' },
        ],
        blanks: [
          { answer: "text-align", placeholder: "___" },
          { answer: "center", placeholder: "___" }
        ],
        chips: ["text-align", "align", "center", "middle"],
        explanation: "<code>text-align: center;</code> vendos tekstin në qendër të elementit."
      }
    ];

    // ─── DOM REFS ───
    const badge = document.getElementById("badge");
    const qTypeLabel = document.getElementById("qTypeLabel");
    const questionText = document.getElementById("questionText");
    const codeBlock = document.getElementById("codeBlock");
    const wordBank = document.getElementById("wordBank");
    const typeWrap = document.getElementById("typeWrap");
    const typeInput = document.getElementById("typeInput");
    const quizForm = document.getElementById("quizForm");
    const livePreview = document.getElementById("livePreview");
    const resultBanner = document.getElementById("resultBanner");
    const explanation = document.getElementById("explanation");
    const submitBtn = document.getElementById("submitBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");

    let current = 0;
    const tracker = quizTracker(quizData.length);
    let blankValues = [];       // current values for each blank
    let answered = false;

    // ─── RENDER ───
    function renderQuestion() {
      const q = quizData[current];
      answered = false;
      blankValues = q.blanks ? q.blanks.map(() => null) : [];

      // Header
      badge.textContent = q.badge;
      questionText.innerHTML = q.question;
      progressText.textContent = `${current + 1}/${quizData.length}`;
      progressBar.style.width = `${((current + 1) / quizData.length) * 100}%`;

      // Reset UI
      resultBanner.className = "result-banner";
      resultBanner.textContent = "";
      explanation.className = "explanation";
      explanation.innerHTML = "";
      submitBtn.disabled = false;
      nextBtn.disabled = true;
      retryBtn.classList.add("hidden");
      livePreview.classList.add("hidden-preview");

      // Hide all question-type containers
      codeBlock.style.display = "none";
      wordBank.style.display = "none";
      typeWrap.style.display = "none";
      quizForm.style.display = "none";

      if (q.type === "fill-blank") {
        qTypeLabel.textContent = "plotëso kodin";
        renderFillBlank(q);
      } else if (q.type === "type-answer") {
        qTypeLabel.textContent = "shkruaj përgjigjen";
        renderTypeAnswer(q);
      } else if (q.type === "mcq") {
        qTypeLabel.textContent = "zgjedh përgjigjen";
        renderMCQ(q);
      }
    }

    // ─── FILL-IN-THE-BLANK ───
    function renderFillBlank(q) {
      codeBlock.style.display = "block";
      wordBank.style.display = "flex";

      // Build code HTML with blank slots
      let html = '';
      for (const part of q.code) {
        if (part.blank !== undefined) {
          const b = q.blanks[part.blank];
          html += `<span class="blank-slot" data-blank="${part.blank}"><span class="placeholder-dots">${b.placeholder}</span></span>`;
        } else {
          const cls = part.class ? ` class="${part.class}"` : '';
          // Replace newlines
          const text = part.text.replace(/\n/g, '<br>');
          html += `<span${cls}>${text}</span>`;
        }
      }
      codeBlock.innerHTML = html;

      // Build word bank chips (shuffled)
      const shuffled = [...q.chips].sort(() => Math.random() - 0.5);
      wordBank.innerHTML = shuffled.map(chip =>
        `<button type="button" class="word-chip" data-value="${chip}">${chip}</button>`
      ).join('');

      // Click on chip → fill next empty blank
      wordBank.querySelectorAll('.word-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          if (answered || btn.classList.contains('used')) return;

          // Find first empty blank
          const emptyIdx = blankValues.indexOf(null);
          if (emptyIdx === -1) return; // all filled

          blankValues[emptyIdx] = btn.dataset.value;
          btn.classList.add('used');

          // Update the blank slot
          const slot = codeBlock.querySelector(`.blank-slot[data-blank="${emptyIdx}"]`);
          slot.textContent = btn.dataset.value;
          slot.classList.add('filled');
          slot.dataset.chipValue = btn.dataset.value;
        });
      });

      // Click on filled blank → remove value, return chip
      codeBlock.addEventListener('click', (e) => {
        const slot = e.target.closest('.blank-slot');
        if (!slot || !slot.classList.contains('filled') || answered) return;

        const idx = parseInt(slot.dataset.blank);
        const val = blankValues[idx];

        // Return chip
        const chip = wordBank.querySelector(`.word-chip[data-value="${val}"]`);
        if (chip) chip.classList.remove('used');

        // Clear blank
        blankValues[idx] = null;
        slot.classList.remove('filled');
        slot.innerHTML = `<span class="placeholder-dots">${q.blanks[idx].placeholder}</span>`;
        delete slot.dataset.chipValue;
      });
    }

    // ─── TYPE ANSWER ───
    function renderTypeAnswer(q) {
      codeBlock.style.display = "block";
      typeWrap.style.display = "flex";

      // Build code with blank
      let html = '';
      for (const part of q.code) {
        if (part.blank !== undefined) {
          html += `<span class="blank-slot" data-blank="${part.blank}" id="typeBlank"><span class="placeholder-dots">${q.blanks[part.blank].placeholder}</span></span>`;
        } else {
          const cls = part.class ? ` class="${part.class}"` : '';
          html += `<span${cls}>${part.text}</span>`;
        }
      }
      codeBlock.innerHTML = html;

      typeInput.value = "";
      typeInput.className = "type-answer-input";
      typeInput.placeholder = q.blanks[0].placeholder;
      typeInput.focus();

      // Live update the code blank as user types
      typeInput.addEventListener('input', () => {
        if (answered) return;
        const val = typeInput.value.trim();
        const slot = document.getElementById('typeBlank');
        if (val) {
          slot.textContent = val;
          slot.classList.add('filled');
          blankValues[0] = val;
        } else {
          slot.innerHTML = `<span class="placeholder-dots">${q.blanks[0].placeholder}</span>`;
          slot.classList.remove('filled');
          blankValues[0] = null;
        }
      });

      // Enter key submits
      typeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitBtn.click();
        }
      });
    }

    // ─── MULTIPLE CHOICE ───
    function renderMCQ(q) {
      quizForm.style.display = "flex";
      quizForm.innerHTML = q.answers.map((a, idx) => `
        <label class="option" data-idx="${idx}" ${a.correct ? 'data-correct="true"' : ''}>
          <input type="radio" name="q" value="${idx}">
          <span>${a.text}</span>
        </label>
      `).join('');
    }

    // ─── SUBMIT ───
    submitBtn.addEventListener("click", () => {
      if (answered) return;
      const q = quizData[current];

      if (q.type === "fill-blank") {
        submitFillBlank(q);
      } else if (q.type === "type-answer") {
        submitTypeAnswer(q);
      } else if (q.type === "mcq") {
        submitMCQ(q);
      }
    });

    function submitFillBlank(q) {
      // Check all blanks filled
      if (blankValues.some(v => v === null)) {
        showResult("bad", "Plotëso të gjitha boshllëqet!");
        return;
      }

      const allCorrect = q.blanks.every((b, i) =>
        blankValues[i]?.toLowerCase() === b.answer.toLowerCase()
      );

      answered = true;

      // Highlight blanks
      codeBlock.querySelectorAll('.blank-slot').forEach(slot => {
        const idx = parseInt(slot.dataset.blank);
        const isRight = blankValues[idx]?.toLowerCase() === q.blanks[idx].answer.toLowerCase();
        slot.classList.add(isRight ? 'correct' : 'wrong');
      });

      // Highlight chips
      wordBank.querySelectorAll('.word-chip').forEach(chip => {
        const val = chip.dataset.value;
        const isAnswer = q.blanks.some(b => b.answer.toLowerCase() === val.toLowerCase());
        if (isAnswer) chip.classList.add('correct-chip');
        else if (chip.classList.contains('used')) chip.classList.add('wrong-chip');
      });

      if (allCorrect) {
        showResult("good", "🎉 Saktë! Bravo!");
        tracker.correct();
        nextBtn.disabled = false;
      } else {
        showResult("bad", "❌ Jo saktë. Provo përsëri!");
        tracker.wrong();
        retryBtn.classList.remove("hidden");
      }

      if (q.explanation) {
        explanation.innerHTML = q.explanation;
        explanation.classList.add("show");
      }
      submitBtn.disabled = true;
    }

    function submitTypeAnswer(q) {
      const userVal = typeInput.value.trim().toLowerCase();
      if (!userVal) {
        showResult("bad", "Shkruaj një vlerë!");
        return;
      }

      answered = true;
      const slot = document.getElementById('typeBlank');
      const alternatives = q.acceptAlternatives || [q.blanks[0].answer];
      const isCorrect = alternatives.some(a => a.toLowerCase() === userVal);

      if (isCorrect) {
        slot.classList.add('correct');
        typeInput.classList.add('correct');
        showResult("good", "🎉 Saktë! Bravo!");
        tracker.correct();
        nextBtn.disabled = false;
      } else {
        slot.classList.add('wrong');
        typeInput.classList.add('wrong');
        showResult("bad", `❌ Jo saktë. Përgjigja: ${q.blanks[0].answer}`);
        tracker.wrong();
        retryBtn.classList.remove("hidden");
      }

      if (q.explanation) {
        explanation.innerHTML = q.explanation;
        explanation.classList.add("show");
      }
      submitBtn.disabled = true;
    }

    function submitMCQ(q) {
      const selected = quizForm.querySelector('input[name="q"]:checked');
      if (!selected) {
        showResult("bad", "Zgjedh një përgjigje!");
        return;
      }

      answered = true;
      const selectedIdx = parseInt(selected.value);
      const isCorrect = q.answers[selectedIdx].correct;

      // Highlight options
      quizForm.querySelectorAll('.option').forEach(opt => {
        opt.classList.add('disabled');
        if (opt.dataset.correct === "true") opt.classList.add('correct');
        if (parseInt(opt.dataset.idx) === selectedIdx && !isCorrect) opt.classList.add('wrong');
      });

      if (isCorrect) {
        showResult("good", "🎉 Saktë!");
        tracker.correct();
        nextBtn.disabled = false;
      } else {
        showResult("bad", "❌ Gabim!");
        tracker.wrong();
        retryBtn.classList.remove("hidden");
      }

      if (q.explanation) {
        explanation.innerHTML = q.explanation;
        explanation.classList.add("show");
      }
      submitBtn.disabled = true;
    }

    // ─── RETRY ───
    retryBtn.addEventListener("click", () => {
      renderQuestion();
    });

    // ─── NEXT ───
    nextBtn.addEventListener("click", async () => {
      current++;
      if (current < quizData.length) {
        renderQuestion();
      } else {
        await tracker.finish(COURSE_SLUG, LESSON_ID, "../css-mesimet/lesson.0.17.html");
      }
    });

    // ─── HELPERS ───
    function showResult(type, msg) {
      resultBanner.textContent = msg;
      resultBanner.className = `result-banner show ${type}`;
    }

    // Start
    renderQuestion();
  </script>
</body>
</html>
