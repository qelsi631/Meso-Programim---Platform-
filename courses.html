<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurset | Mëso Programimin</title>
  <link rel="stylesheet" href="css/courses.css">
</head>
<body>
  <div class="courses-container">
    <!-- Header -->
    <header class="courses-header">
      <div class="header-content">
        <div class="header-brand">
          <img src="/imgs/icon ngjyr bardhe.png" alt="Logo" class="courses-logo">
          <div class="brand-text">
            <span class="brand-name">Meso Programim</span>
            <h1>Kurset</h1>
            <p>Zgjidh kursin dhe fillo të mësosh</p>
          </div>
        </div>
        <a href="dashboard.html" class="btn btn-outline">Paneli im</a>
      </div>
    </header>

    <!-- Filters -->
    <section class="filters-section">
      <div class="filter-group">
        <label>Filtro sipas nivelit:</label>
        <select id="levelFilter">
          <option value="">Të gjitha nivelet</option>
          <option value="beginner">Fillestar</option>
          <option value="intermediate">Mesatar</option>
          <option value="advanced">Avancuar</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Kërko:</label>
        <input type="text" id="searchInput" placeholder="Kërko kurse...">
      </div>
    </section>

    <!-- Courses Grid -->
    <section class="browse-courses">
      <div class="courses-grid" id="coursesGrid">
        <div class="loading">Po ngarkohen kurset...</div>
      </div>
    </section>
  </div>

  <!-- Enrollment Modal -->
  <div id="enrollModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" id="enrollModalClose">&times;</button>
      
      <div class="enroll-header">
        <div class="enroll-icon" id="enrollIcon">📚</div>
        <h2 id="enrollTitle">Titulli i kursit</h2>
        <p id="enrollDesc" class="text-muted">Përshkrimi i kursit</p>
      </div>

      <div class="enroll-details">
        <div class="detail-item">
          <span class="detail-label">Niveli:</span>
          <span class="detail-value" id="enrollLevel">Fillestar</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Mësime:</span>
          <span class="detail-value" id="enrollLessons">10 mësime</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Kohëzgjatja:</span>
          <span class="detail-value" id="enrollDuration">4-6 javë</span>
        </div>
      </div>

      <p id="enrollMessage" class="enroll-message"></p>

      <div class="modal-footer">
        <button class="btn btn-primary" id="enrollBtn">Regjistrohu tani</button>
        <button class="btn btn-outline" id="enrollCancel">Anulo</button>
      </div>
    </div>
  </div>

  <div id="enrollOverlay" class="modal-overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/courses.js"></script>
</body>
</html>
